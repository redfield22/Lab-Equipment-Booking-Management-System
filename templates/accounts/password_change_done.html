{% extends 'base.html' %}
{% load static %}

{% block title %}Password Changed Successfully - Lab Inventory System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <div class="card card-custom p-5 border-0 shadow-sm">
                <div class="mb-4">
                    <span class="p-3 bg-success-subtle text-success rounded-circle d-inline-block">
                        <i class="fa-solid fa-circle-check fa-3x"></i>
                    </span>
                </div>
                <h4 class="fw-bold mb-2">Password Updated!</h4>
                <p class="text-secondary small mb-4">Your account password has been changed successfully.</p>
                <a href="{% url 'profile' %}" class="btn btn-primary-custom px-4 py-2">
                    <i class="fa-solid fa-user me-1"></i> Back to Profile
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
